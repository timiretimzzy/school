<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://uvmgmbwnsdebtkwldfaa.supabase.co; font-src 'self' https://cdn.jsdelivr.net;">
<title>EduStack | FiscalStack Solutions</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<script src="config.js"></script>
</head>
<body>
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="brand"><b>EDUSTACK</b><small>FiscalStack Solutions</small></div>
    <p id="config-status" class="muted"></p>
    <form id="login-form">
      <label>Login ID<input id="login-id" type="text" placeholder="STU-7K4M92 or TCH-X8P3Q1" required autocomplete="username"></label>
      <label>Password<input id="login-password" type="password" required autocomplete="current-password"></label>
      <button type="submit" class="primary">Sign in</button>
    </form>
    <p id="login-msg" role="status"></p>
    <p class="muted small">Have an invitation instead? <a href="#/accept-invite">Accept it here</a> after signing in.</p>
  </div>
</div>

<div id="shell" class="shell hidden">
  <aside id="sidebar">
    <div class="brand"><img id="brand-logo" class="hidden"><b id="brand-name">EDUSTACK</b><small>FiscalStack Solutions</small></div>
    <nav id="sidebar-nav"></nav>
    <footer>
      <select id="context-switch"></select>
      <button id="signout" class="link">Sign out</button>
    </footer>
  </aside>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <main>
    <header>
      <div style="display:flex;align-items:center;gap:12px">
        <button id="hamburger" class="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <div>
          <small id="context-label">WORKSPACE</small>
          <h1 id="page-title">Dashboard</h1>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="session-badge">●</span>
        <span id="notif-bell" style="cursor:pointer;font-size:20px" title="Notifications">🔔</span>
        <span id="notif-count" class="badge" style="display:none;position:relative;top:-8px;left:-8px;font-size:11px"></span>
      </div>
    </header>
    <div id="app"></div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
